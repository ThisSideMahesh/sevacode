<html>
<head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['table']});
      google.charts.setOnLoadCallback(drawTable);

      function drawTable() {
        var data = new google.visualization.DataTable();
        data.addColumn('string', 'वार');
          data.addColumn('string', 'काळ');
          data.addColumn('string', 'वेळ');
        data.addRows([
          ['रविवार',  'सायंकाळ', '४.३०  ते  ६.००'],
          ['सोमवार',   'सकाळ',  '७.३०  ते  ९.००'],
          ['मंगळवार', 'दुपार', '३.०० ते ४.३०'],
           ['बुधवार',  'दुपार', '१२.००  ते  १.३०'],
          ['गुरुवार',   'दुपार',  '१.३० ते ३.००'],
          ['शुक्रवार', 'सकाळ', '१०.३०  ते  १२.००'],
          ['शनिवार',  'सकाळ',  '९.०० ते १०.३०']
        ]);

        var table = new google.visualization.Table(document.getElementById('table_div'));

        table.draw(data, {showRowNumber: true, width: '100%', height: '100%'});
      }

    </script>
</head>
<body>
<div id="table_div"></div>
</body>
</html>
